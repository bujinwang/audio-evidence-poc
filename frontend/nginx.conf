server {
    listen 80;
    server_name _;

    # Evidence files can be large; keep uploads and audio streaming unbuffered.
    client_max_body_size 512m;
    proxy_buffering off;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Actor $http_x_actor;
        proxy_set_header X-Role $http_x_role;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Range requests must reach FastAPI untouched for timestamp seeking.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
